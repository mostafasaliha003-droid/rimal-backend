    <!-- 🚀 ربط ملف التنسيقات الخارجي للبراند -->

    <style>
        :root {
            --primary: #1f3a40;        
            --accent-cyan: #00b4d8;    
            --accent-coral: #ff595e;  
            --accent-yellow: #ffca3a;
            --accent-purple: #7209b7;
            --bg-light: #f8fafc;     
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); overflow-x: hidden; width: 100%; -webkit-tap-highlight-color: transparent; }

        .view-section { display: none; }
        .view-section.active { display: block; animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes bounceIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { opacity: 0; transform: translateY(20px); animation: fadeInUp 0.5s ease-out forwards; }

        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-animate { animation: scaleIn 0.3s ease-out forwards; }
        
        .hide-select-arrow { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        
        /* =========================================================
           📱 Ultimate Mobile UX Enhancements
           ========================================================= */
        @media (max-width: 768px) {
            /* 1. إخفاء العناصر المعقدة في الهيدر */
            .mobile-hide { display: none !important; }
            
            /* 2. شريط البحث اللاصق (Collapsed Sticky Search) */
            .mobile-search-bar {
                position: sticky; top: 0; z-index: 900; background: white;
                padding: 10px 15px; border-bottom: 1px solid #e2e8f0;
                box-shadow: 0 4px 15px rgba(0,0,0,0.05);
                display: flex !important; justify-content: space-between; align-items: center;
                transition: transform 0.3s ease;
            }
            .mobile-search-expanded { display: none; }
            
            /* 3. نافذة البحث المنبثقة (Bottom Sheet) */
            .mobile-bottom-sheet {
                position: fixed; bottom: 0; left: 0; right: 0;
                background: white; border-radius: 24px 24px 0 0;
                padding: 20px; z-index: 4000; box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
                transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .mobile-bottom-sheet.open { transform: translateY(0); }
            
            /* 4. شريط التنقل السفلي PWA (Bottom Nav) */
            .bottom-nav {
                position: fixed; bottom: 0; left: 0; right: 0;
                background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
                border-top: 1px solid #e2e8f0; display: flex !important; justify-content: space-around;
                padding-bottom: env(safe-area-inset-bottom); z-index: 1000;
                box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            }
            .bottom-nav-item {
                display: flex; flex-direction: column; align-items: center; padding: 8px 0;
                color: var(--text-muted); font-size: 10px; font-weight: bold; text-decoration: none;
            }
            .bottom-nav-item.active { color: var(--accent-cyan); }
            .bottom-nav-item i { font-size: 20px; margin-bottom: 4px; }
            
            /* 5. بطاقة الفندق المضغوطة (Compact Hotel Card) */
            .compact-card { flex-direction: column !important; padding: 0 !important; overflow: hidden; }
            .compact-card .img-container { width: 100% !important; height: 200px !important; border-radius: 0 !important; }
            .compact-card-body { padding: 15px !important; }
            .compact-facilities-scroll { display: flex; overflow-x: auto; white-space: nowrap; padding-bottom: 5px; scrollbar-width: none; }
            .compact-facilities-scroll::-webkit-scrollbar { display: none; }
            
            /* تعديل زر السعر ليكون مدمج */
            .compact-price-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #e2e8f0; }
            .compact-price-row .price-box { background: transparent !important; border: none !important; padding: 0 !important; text-align: right; width: auto !important; }
            .compact-price-row button { width: auto !important; padding: 10px 20px !important; border-radius: 12px !important; margin: 0 !important; }
            
            body { padding-bottom: 70px; } /* لترك مساحة للـ Bottom Nav */
        }

        /* =========================================================
           🚀 إعدادات الديسكتوب (لم يتم مساسها)
           ========================================================= */
        .live-ticker {
            background: linear-gradient(90deg, #112226, #1f3a40, #00b4d8); background-size: 200% 200%; animation: gradientMove 5s ease infinite;
            color: white; padding: 8px 5%; font-size: 11px; md:font-size: 13px; font-weight: 800; text-align: center;
            display: flex; justify-content: center; align-items: center; gap: 6px; md:gap: 10px; border-bottom: 1px solid rgba(0, 180, 216, 0.3);
        }
        @keyframes gradientMove { 0% {background-position: 0% 50%;} 50% {background-position: 100% 50%;} 100% {background-position: 0% 50%;} }

        header {
            background: rgba(31, 58, 64, 0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 4%; md:padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; color: white; position: sticky; top: 0; z-index: 1000; transition: all 0.3s ease;
        }

        .settings-dropdown { background: transparent; padding: 4px 8px; md:padding: 6px 12px; border-radius: 20px; font-size: 11px; md:font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.9); display: flex; align-items: center; gap: 4px; md:gap: 6px; cursor: pointer; transition: all 0.2s ease; }
        .settings-dropdown:hover { background: rgba(255, 255, 255, 0.1); color: white; }
        .settings-dropdown select { background: transparent; border: none; font-weight: 900; font-family: 'Cairo'; color: inherit; outline: none; cursor: pointer; }
        .settings-dropdown select option { background: var(--primary); color: white; }

        .user-dropdown-container { position: relative; display: inline-block; }
        .user-dropdown-content { display: none; position: absolute; right: 0; background-color: #ffffff; min-width: 250px; box-shadow: 0 20px 40px rgba(0,0,0,0.25); border-radius: 20px; z-index: 2000; overflow: hidden; border: 2px solid var(--accent-cyan); text-align: right; }
        .user-dropdown-content a, .user-dropdown-content div.dropdown-header { color: var(--primary); padding: 12px 16px; text-decoration: none; display: block; font-size: 13px; font-weight: 800; cursor: pointer; }
        .user-dropdown-content div.dropdown-header { background: #f8fafc; border-bottom: 2px solid #e2e8f0; color: var(--primary); line-height: 1.5; }
        .user-dropdown-content a:hover { background-color: #f1f5f9; color: var(--accent-cyan); }
        .user-dropdown-container:hover .user-dropdown-content { display: block; }

        .nav-pill { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 9999px; padding: 4px; display: flex; gap: 4px; }
        .nav-pill-btn { padding: 8px 20px; border-radius: 9999px; font-size: 13px; font-weight: 800; color: rgba(255, 255, 255, 0.8); transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; cursor: pointer; border: none; background: transparent; }
        .nav-pill-btn:hover, .nav-pill-btn.active { background: rgba(255, 255, 255, 0.15); color: white; }

        .container { padding: 0 4%; md:padding: 0 5%; margin-bottom: 60px; max-width: 1200px; margin-left: auto; margin-right: auto; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 3000; }
        .modal-content { background: white; padding: 20px; md:padding: 30px; border-radius: 24px; width: 90%; max-width: 480px; border: 4px solid var(--accent-cyan); text-align: center; max-height: 90vh; overflow-y: auto; position: relative; }

        /* فواصل التذاكر للديسكتوب */
        .ticket-divider-v { width: 2px; background-image: linear-gradient(to bottom, #e2e8f0 50%, rgba(255,255,255,0) 0%); background-position: right; background-size: 2px 14px; background-repeat: repeat-y; position: relative; }
        .ticket-divider-v::before, .ticket-divider-v::after { content: ''; position: absolute; left: -12px; width: 26px; height: 26px; background-color: var(--bg-light); border-radius: 50%; box-shadow: inset 0 3px 6px rgba(0,0,0,0.04); z-index: 20; }
        .ticket-divider-v::before { top: -13px; } .ticket-divider-v::after { bottom: -13px; }

        @keyframes subtlePulse { 0% { filter: drop-shadow(0 0 0 rgba(250, 204, 21, 0.4)); } 50% { filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.8)); } 100% { filter: drop-shadow(0 0 0 rgba(250, 204, 21, 0)); } }
        .pulse-coin { animation: subtlePulse 2.5s infinite; }
        .bg-pattern { background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
        .goog-te-banner-frame { display: none !important; }
        body { top: 0px !important; }
    </style>
</head>

        function handleMobileScroll() {
            if (window.innerWidth > 768) return; // تعطيل في الديسكتوب
            const searchForm = document.getElementById('searchFormContainer') || document.querySelector('section.relative.z-30');
            const stickyBar = document.querySelector('.mobile-search-bar');
            
            if(searchForm && stickyBar) {
                const rect = searchForm.getBoundingClientRect();
                // إذا تجاوزنا نموذج البحث، أظهر الشريط اللاصق
                if (rect.bottom < 0) {
                    stickyBar.classList.remove('hidden');
                } else {
                    stickyBar.classList.add('hidden');
                }
            }
        }

        window.addEventListener('scroll', handleMobileScroll);

        function openMobileSearchSheet() {
            if (window.innerWidth > 768) return;
            const sheet = document.getElementById('mobileSearchSheet');
            const originalSearchContent = document.querySelector('section.relative.z-30 > div');
            const targetContent = document.getElementById('mobileSearchContentTarget');
            
            // نقل محتوى البحث من الصفحة إلى النافذة المنبثقة إذا لم يتم نقله مسبقاً
            if (originalSearchContent && targetContent && targetContent.children.length === 0) {
                 // إضافة كلاسات لترتيب العناصر عمودياً في الموبايل بشكل أفضل
                 originalSearchContent.classList.add('flex-col', 'shadow-none', 'border-none', 'p-0');
                 originalSearchContent.classList.remove('md:rounded-3xl');
                 targetContent.appendChild(originalSearchContent);
            }
            
            sheet.classList.remove('hidden');
            // تأخير بسيط للسماح بحركة الـ CSS Transition
            setTimeout(() => sheet.classList.add('open'), 10);
            
            // إضافة خلفية مظلمة
            const overlay = document.createElement('div');
            overlay.id = 'mobileSheetOverlay';
            overlay.className = 'fixed inset-0 bg-slate-900/60 z-[3900] backdrop-blur-sm transition-opacity opacity-0';
            document.body.appendChild(overlay);
            overlay.onclick = closeMobileSearchSheet;
            setTimeout(() => overlay.classList.add('opacity-100'), 10);
        }

        function closeMobileSearchSheet() {
            const sheet = document.getElementById('mobileSearchSheet');
            const overlay = document.getElementById('mobileSheetOverlay');
            
            sheet.classList.remove('open');
            if(overlay) overlay.classList.remove('opacity-100');
            
            setTimeout(() => {
                sheet.classList.add('hidden');
                if(overlay) overlay.remove();
                
                // إعادة نموذج البحث لمكانه الأصلي إذا أردنا (اختياري، يفضل إبقاؤه لسهولة الفتح مجدداً)
            }, 400);
            
            // تحديث نصوص الشريط اللاصق بناءً على الاختيارات
            const dest = document.getElementById('destinationSelect');
            const adults = document.getElementById('adultsInput');

        // 🌟 Toast & Navigation Logic
        function showToast(type, title, message) {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            let baseClasses = "flex items-start gap-3 md:gap-3.5 bg-white p-3 md:p-4 rounded-xl shadow-[0_15px_40px_rgba(0,0,0,0.12)] w-full max-w-sm pointer-events-auto transform transition-all duration-500 -translate-y-10 opacity-0 scale-95 border border-slate-50";
            let iconHtml = ""; let borderClass = "";
            
            if (type === 'success') {
                borderClass = "border-r-4 border-r-green-500";
                iconHtml = `<div class="mt-0.5 bg-green-50 w-7 h-7 md:w-8 md:h-8 rounded-full flex items-center justify-center shrink-0"><i class="fa-solid fa-circle-check text-green-500 text-sm md:text-lg"></i></div>`;
            } else if (type === 'error') {
                borderClass = "border-r-4 border-r-[#ff595e]";
                iconHtml = `<div class="mt-0.5 bg-red-50 w-7 h-7 md:w-8 md:h-8 rounded-full flex items-center justify-center shrink-0"><i class="fa-solid fa-circle-xmark text-[#ff595e] text-sm md:text-lg animate-pulse"></i></div>`;
            } else if (type === 'info') {
                borderClass = "border-r-4 border-r-[#00b4d8]";
                iconHtml = `<div class="mt-0.5 bg-[#00b4d8]/10 w-7 h-7 md:w-8 md:h-8 rounded-full flex items-center justify-center shrink-0"><i class="fa-solid fa-circle-info text-[#00b4d8] text-sm md:text-lg"></i></div>`;
            }

            toast.className = `${baseClasses} ${borderClass}`;
            toast.innerHTML = `
                ${iconHtml}
                <div class="flex-1 pt-0.5">
                    <h4 class="text-xs md:text-sm font-black text-slate-800 leading-tight">${title}</h4>
                    <p class="text-[10px] md:text-xs font-bold text-slate-500 mt-1 md:mt-1.5 leading-relaxed">${message}</p>
                </div>
                <button onclick="closeToast(this.parentElement)" class="text-slate-300 hover:text-slate-500 transition-colors shrink-0 mt-0.5 p-1 cursor-pointer bg-transparent border-none">
                    <i class="fa-solid fa-xmark text-xs md:text-sm"></i>
                </button>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('-translate-y-10', 'opacity-0', 'scale-95');
                toast.classList.add('translate-y-0', 'opacity-100', 'scale-100');
            }, 10);
            setTimeout(() => { closeToast(toast); }, 4000);
        }

        function closeToast(toastElement) {
            if (!toastElement) return;
            toastElement.classList.remove('translate-y-0', 'opacity-100', 'scale-100');
            toastElement.classList.add('-translate-y-4', 'opacity-0', 'scale-95');
            setTimeout(() => { toastElement.remove(); }, 500);
        }

        // 🌟 Socket Chat System
        function initLiveChatSocket() {
            const socket = io(API_URL);
            const openBtn = document.getElementById('openChatBtn');
            const closeBtn = document.getElementById('closeChatBtn');
            const chatModal = document.getElementById('chatBoxModal');
            const startBtn = document.getElementById('startChatBtn');
            const authView = document.getElementById('authView');
            const messagesView = document.getElementById('messagesView');
            const errorMsg = document.getElementById('chatErrorMsg');
            const sendBtn = document.getElementById('sendMsgBtn');
            const msgInput = document.getElementById('messageInput');
            const chatMsgs = document.getElementById('chatMessages');

            let currentRef = ''; let currentName = '';

            if(!openBtn || !chatModal) return;

            openBtn.onclick = () => { chatModal.classList.remove('hidden'); chatModal.classList.add('flex'); };
            closeBtn.onclick = () => { chatModal.classList.add('hidden'); chatModal.classList.remove('flex'); };

            startBtn.onclick = () => {
                currentRef = document.getElementById('refCodeInput').value.trim();
                currentName = document.getElementById('clientNameInput').value.trim();
                if(!currentRef || !currentName) { errorMsg.innerText = 'يرجى إدخال رقم الحجز والاسم.'; return; }
                socket.emit('join_chat', { referenceCode: currentRef, clientName: currentName });
            };

            socket.on('chat_joined', (res) => {
                if(res.success) {
                    authView.style.display = 'none';
                    messagesView.classList.remove('hidden'); messagesView.classList.add('flex');
                    chatMsgs.innerHTML += `<div style="text-align: center; color: green; margin-bottom: 5px; font-size:11px;">${res.message}</div>`;
                } else { errorMsg.innerText = res.message; }
            });

            sendBtn.onclick = sendMessage;
            msgInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

            function sendMessage() {
                const text = msgInput.value.trim();
                if(!text) return;
                socket.emit('send_message', { referenceCode: currentRef, sender: currentName, message: text });
                msgInput.value = '';
            }

            socket.on('receive_message', (data) => {
                chatMsgs.innerHTML += `<div style="margin-bottom: 6px;"><b>${data.sender}:</b> ${data.message}</div>`;
                chatMsgs.scrollTop = chatMsgs.scrollHeight;
            });
        }

        async function fetchLiveDestinations() {
            try {

                if (data.success && data.destinations && data.destinations.length > 0) {
                    const select = document.getElementById('destinationSelect');
                    select.innerHTML = '';
                    data.destinations.forEach(dest => {
                        let name = dest.name && dest.name.content ? dest.name.content : dest.code;
                        select.innerHTML += `<option value="${dest.code}">${name} (${dest.code}) 📍</option>`;
                    });
                }
            } catch (e) { console.error("خطأ في جلب الوجهات الجغرافية:", e); }
        }

        function changeCurrency() {
            const selectedCurrency = document.getElementById('currencySelector').value;
            const priceElements = document.querySelectorAll('.hotel-price-display');
            const rates = { 'USD': 0.27, 'EUR': 0.25, 'SAR': 1.02, 'AED': 1 };
            
            for (let el of priceElements) {
                let basePriceAED = parseFloat(el.getAttribute('data-price-aed'));
                if (!basePriceAED) continue;
                let converted = (basePriceAED * rates[selectedCurrency]).toFixed(2);
                
                let prevSibling = el.previousElementSibling;
                if (prevSibling && prevSibling.classList.contains('currency-label')) {
                    el.innerText = converted;
                    prevSibling.innerText = selectedCurrency;
                } else { el.innerText = `${converted} ${selectedCurrency}`; }
            }
            updateFinalPriceCalculation();
        }

                    { elementType: "labels.text.fill", stylers: [{ color: "#1f3a40" }] },
                    { featureType: "water", elementType: "geometry", stylers: [{ color: "#c9e2fc" }] }
                ]
            });
            updateGoogleMarkers(allHotels);
        }

        function updateGoogleMarkers(hotelsArray) {
            if (!gMap) return;
            gMarkers.forEach(m => m.setMap(null));
            gMarkers = [];
            hotelsArray.forEach(hotel => {
                const marker = new google.maps.Marker({ position: { lat: hotel.lat, lng: hotel.lng }, map: gMap, title: hotel.name, animation: google.maps.Animation.DROP });
                const infowindow = new google.maps.InfoWindow({ content: `<div style="font-family:Cairo; text-align:right; direction:rtl; padding:5px; font-size:12px;"><strong>${hotel.name}</strong><br>السعر: <b style="color:#ff595e;">${hotel.priceAED} AED</b></div>` });
                marker.addListener("click", () => { infowindow.open(gMap, marker); });
                gMarkers.push(marker);
            });
        }

            if (currentUser) {

        function setupDropdownToggle() {
            const menuBtn = document.getElementById('user-menu-btn');
            const dropdown = document.getElementById('user-dropdown');
            if (!menuBtn || !dropdown) return;
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                dropdown.classList.toggle('opacity-0'); dropdown.classList.toggle('invisible'); dropdown.classList.toggle('translate-y-2');
            });
            document.addEventListener('click', (e) => {

        async function fetchUserData() {
            if(!currentUser) return;
            const bookingsContainer = document.getElementById('bookingsContainer');
            if (!bookingsContainer) return;
            
            bookingsContainer.innerHTML = `<div class="flex justify-center items-center py-12 md:py-16"><div class="animate-spin rounded-full h-8 w-8 md:h-10 md:w-10 border-b-4 border-[#00b4d8]"></div><span class="mr-3 md:mr-4 text-[#1f3a40] font-black text-sm md:text-lg">جاري جلب حجوزاتك الفاخرة...</span></div>`;
            
            try {
                const res = await fetch(`${API_URL}/api/user/profile?email=${encodeURIComponent(currentUser.email)}`);
                const data = await res.json();
                
                if(data.success) {
                    currentUser.points = data.profile.points;
                    currentUser.savedCards = data.profile.savedCards;
                    localStorage.setItem('rimal_current_user', JSON.stringify(currentUser));
                    
                    let pts = currentUser.points || 500; 
                    let ptsAED = (pts / 10).toFixed(2);
                    
                    const dashPointsDisplayEl = document.getElementById('dashPointsDisplay');
                    if (dashPointsDisplayEl) dashPointsDisplayEl.innerText = pts;
                    const dashPointsAEDDisplayEl = document.getElementById('dashPointsAEDDisplay');
                    if (dashPointsAEDDisplayEl) dashPointsAEDDisplayEl.innerText = ptsAED;
                    
                    if(!data.bookings || data.bookings.length === 0) {
                        bookingsContainer.innerHTML = `
                            <div class="text-center py-12 md:py-16 px-4 bg-white shadow-sm rounded-2xl md:rounded-3xl border border-dashed border-slate-300">
                                <svg class="w-16 h-16 md:w-24 md:h-24 mx-auto mb-3 md:mb-4 fill-slate-200" viewBox="0 0 512 512"><path d="M144 112c-26.5 0-48 21.5-48 48v288c0 26.5 21.5 48 48 48h224c26.5 0 48-21.5 48-48V160c0-26.5-21.5-48-48-48h-16V64c0-35.3-28.7-64-64-64h-64c-35.3 0-64 28.7-64 64v48h-16zM192 64c0-17.7 14.3-32 32-32h64c17.7 0 32 14.3 32 32v48H192V64zM64 224h384v224c0 8.8-7.2 16-16 16H80c-8.8 0-16-7.2-16-16V224z"/></svg>
                                <h3 class="text-lg md:text-2xl font-black text-slate-400 mb-1 md:mb-2">لا توجد حجوزات حالياً</h3>
                                <p class="text-xs md:text-sm text-slate-400 font-bold">ابدأ مغامرتك القادمة واجمع نقاط الكاش باك!</p>
                            </div>`; 
                        return;
                    }

                    let cardsHTML = '';
                    
                    data.bookings.forEach((booking, index) => {
                        let isConfirmed = booking.status !== 'cancelled';
                        const animationDelay = index * 100;
                        
                        let cardBg = isConfirmed ? 'bg-white' : 'bg-slate-50 opacity-90';
                        let cardBorder = isConfirmed ? 'border-slate-200 hover:border-[#00b4d8] hover:shadow-xl' : 'border-slate-300 border-dashed';
                        
                        let statusBadge = isConfirmed 
                            ? `<div class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-2 md:px-3 py-1 rounded-md md:rounded-lg text-[10px] md:text-[11px] font-black flex items-center gap-1 md:gap-1.5 shadow-sm shrink-0">${UI_ICONS.success} حجز مؤكد</div>` 
                            : `<div class="bg-red-50 border border-red-200 text-red-700 px-2 md:px-3 py-1 rounded-md md:rounded-lg text-[10px] md:text-[11px] font-black flex items-center gap-1 md:gap-1.5 shadow-sm shrink-0">${UI_ICONS.fail} حجز ملغي</div>`;

                        let cancelledWatermark = !isConfirmed ? `<div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0 overflow-hidden"><span class="text-6xl md:text-8xl lg:text-9xl font-black text-slate-200/50 transform -rotate-12 border-4 md:border-8 border-slate-200/50 p-2 md:p-4 rounded-xl md:rounded-3xl">ملغي</span></div>` : '';

                        let cleanHotelName = (booking.hotelName || '').replace(/[\u{1F300}-\u{1F6FF}\u{2600}-\u{26FF}]/gu, '').trim();

                        cardsHTML += `
                            <div class="relative flex flex-col md:flex-row ${cardBg} rounded-2xl md:rounded-3xl shadow-md border ${cardBorder} transition-all duration-300 mb-6 md:mb-8 overflow-hidden animate-fade-in-up" style="animation-delay: ${animationDelay}ms;">
                                
                                ${cancelledWatermark}

                                <div class="p-4 md:p-8 flex-1 min-w-0 relative z-10 flex flex-col justify-between">

        function filterHotels() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const cityRadio = document.querySelector('input[name="cityFilter"]:checked');
            const sortRadio = document.querySelector('input[name="sortFilter"]:checked');
            
            const cityValue = cityRadio ? cityRadio.value : 'all';
            const sortValue = sortRadio ? sortRadio.value : 'recommended';

            let filtered = allHotels.filter(h => {
                const matchesQuery = h.name.toLowerCase().includes(query) || h.city.toLowerCase().includes(query);
                const matchesCity = (cityValue === 'all' || h.city === cityValue);
                return matchesQuery && matchesCity;
            });

            if (sortValue === 'price_low') { filtered.sort((a, b) => a.priceAED - b.priceAED); } 
            else if (sortValue === 'points_high') { filtered.sort((a, b) => b.basePoints - a.basePoints); }

            displayHotels(filtered); updateGoogleMarkers(filtered); changeCurrency();
        }

        function renderChildAges() {
            const count = parseInt(document.getElementById('childrenInput').value) || 0;
            const container = document.getElementById('childAgesContainer');
            if (!container) return;
            container.innerHTML = '';
            if (count > 0) {
                container.style.display = 'block';
                let html = '<label class="text-[11px] md:text-[13px] font-black text-[#1f3a40] mb-2 md:mb-3 display-block">أعمار الأطفال عند تسجيل الوصول:</label><div class="flex gap-2 md:gap-3 flex-wrap">';
                for (let i = 0; i < count; i++) { 
                    html += `<div class="flex-1 min-w-[80px] md:min-w-[100px]"><label class="text-[9px] md:text-[11px] text-slate-500 font-bold mb-1 display-block">الطفل ${i+1}</label><select class="childAgeSelect w-full p-2 md:p-2.5 rounded-lg md:rounded-xl border border-slate-300 font-bold text-xs md:text-sm outline-none focus:border-[#00b4d8]">${generateAgeOptions()}</select></div>`; 
                }
                html += '</div>'; container.innerHTML = html;
            } else { container.style.display = 'none'; }
        }

        async function searchLiveHotels() {
            const query = document.getElementById('searchInput').value;
            const destinationCode = document.getElementById('destinationSelect').value;
            const checkIn = document.getElementById('checkInDate').value;
            const checkOut = document.getElementById('checkOutDate').value;
            const adults = document.getElementById('adultsInput').value;
            const children = document.getElementById('childrenInput').value;
            const boardBasis = document.getElementById('boardBasisFilter').value;

            let childrenAges = []; document.querySelectorAll('.childAgeSelect').forEach(sel => childrenAges.push(parseInt(sel.value)));

            const btn = document.getElementById('searchBtnText');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-sm md:text-base"></i> <span class="text-xs md:text-sm">جاري البحث...</span>'; 
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/api/v1/hotels/search`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ checkIn, checkOut, adults: parseInt(adults), children: parseInt(children), childrenAges, boardBasis, destinationCode })
                });
                const data = await res.json();

                                <div class="relative z-10 min-w-0">

                                    <span class="font-semibold block whitespace-pre-line text-slate-600 leading-relaxed"><bdi dir="auto"><span style="unicode-bidi: plaintext;">${room.policyText}</span></bdi></span>
                                </div>
                            </div>
                        </div>

                        <div class="hidden lg:block ticket-divider-v z-20"></div>
                        <div class="lg:hidden ticket-divider-h z-20 my-2"></div>

                        <!-- تعديل التوسيط في الموبايل -->
                        <div class="w-full lg:w-[260px] xl:w-[280px] p-4 sm:p-6 md:p-8 flex flex-row lg:flex-col justify-between items-center lg:justify-center bg-slate-50 shrink-0 z-10 relative lg:border-l border-slate-50">
                            <div class="text-right lg:text-center w-1/2 lg:w-full">
                                <span class="hidden lg:block text-[9px] md:text-[11px] font-bold text-slate-400 mb-0.5 md:mb-1">ابتداءً من (لليلة)</span>
                                <div class="text-left lg:text-center mb-1 flex items-baseline justify-start lg:justify-center gap-1 md:gap-1.5" dir="ltr">
                                    <span class="text-xs md:text-sm font-bold text-slate-400 currency-label">AED</span>
                                    <span class="text-2xl sm:text-4xl lg:text-5xl font-black text-[#1f3a40] tracking-tighter hotel-price-display" data-price-aed="${room.price}">${room.price}</span>
                                </div>
                                <span class="text-[8px] md:text-[10px] text-slate-400 font-bold mb-2 md:mb-5 block text-right lg:text-center">شامل الضرائب</span>
                                
                                <div class="hidden lg:flex w-full bg-white border border-amber-100 rounded-lg md:rounded-xl p-2 items-center justify-start gap-2 md:gap-3 shadow-sm cursor-default">
                                    ${currentUser ? coinBadgeHTML : `<div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-amber-50 flex items-center justify-center border border-amber-200 cursor-pointer hover:bg-amber-100 shrink-0" onclick="openAuthModal()"><i class="fa-solid fa-piggy-bank text-amber-500 text-xs md:text-base"></i></div>`}
                                    <div class="text-right flex-1">
                                        <span class="block text-[8px] md:text-[9px] text-amber-600 font-black uppercase tracking-wider">كاش باك</span>
                                        <span class="block text-[10px] md:text-xs font-black text-[#1f3a40]">${currentUser ? `+ ${cashbackAED} نقطة` : '<span class="text-slate-400 underline decoration-dashed cursor-pointer text-[9px] md:text-[10px]" onclick="openAuthModal()">سجل لتربح</span>'}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="w-1/2 lg:w-full">
                                <button class="w-full bg-gradient-to-l from-[#800000] to-[#a30000] hover:from-[#990000] hover:to-[#cc0000] active:scale-[0.98] transition-all duration-300 text-white font-black py-2.5 px-2 md:py-4 rounded-xl shadow-md border-none cursor-pointer text-xs md:text-base flex items-center justify-center gap-1.5 md:gap-2 lg:mb-4" 
                                    onclick="goToBooking('${hotelName.replace(/'/g, "\\'")}', ${room.price}, '${room.name.replace(/'/g, "\\'")}', '${room.board}', '${room.policyText.replace(/'/g, "\\'")}', '${room.rateKey}', '${room.paymentType}', '${room.refundType}')">
                                    <i class="fa-solid fa-lock text-white/50 text-[10px] md:text-sm"></i> حجز الغرفة
                                </button>
                            </div>
                        </div>
                    </div>`;
            });
            changeCurrency(); switchView('roomSelectionView');
        }

        async function fetchAndDisplayHotelReviews(hotelName) {
            const container = document.getElementById('hotelReviewsContainer');
            if (!container) return; container.innerHTML = '<p class="text-center text-xs md:text-sm text-slate-400 font-bold py-4">جاري جلب التقييمات...</p>';
            try {
                const res = await fetch(`${API_URL}/api/v1/reviews/hotel/${encodeURIComponent(hotelName)}`);
                const data = await res.json();
                if (data.success) {
                    let html = `<div class="text-center mb-5 md:mb-6"><div class="inline-flex items-center justify-center gap-2 md:gap-3 bg-slate-50 border border-slate-100 px-4 md:px-6 py-2 md:py-3 rounded-xl md:rounded-2xl flex-wrap"><span class="text-slate-600 font-bold text-xs md:text-sm">متوسط التقييم العام:</span><span class="text-[#1f3a40] font-black text-xl md:text-2xl tracking-tight" dir="ltr">${data.averageRating} <span class="text-[10px] md:text-sm text-slate-400">/ 5</span></span><div class="flex text-yellow-400 text-[10px] md:text-sm">`;
                    for(let i=0; i<Math.round(data.averageRating); i++) html += '<i class="fa-solid fa-star"></i>';
                    html += `</div><span class="text-[10px] md:text-xs font-bold text-slate-400">(${data.totalReviews} تقييم معتمد)</span></div></div>`;
                    
                    let allCombinedReviews = [...data.reviews.local, ...data.reviews.globalSupplier];
                    if (allCombinedReviews.length === 0) { html += `<p class="text-center text-[10px] md:text-sm font-bold text-slate-400 py-4 md:py-6">لا توجد تقييمات محلية بعد، كن أول من يقيّم هذا الفندق!</p>`; } 
                    else {
                        html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">`;
                        allCombinedReviews.forEach(rev => {
                            let stars = ''; for(let i=0; i<Math.round(rev.rating); i++) stars += '<i class="fa-solid fa-star text-yellow-400 text-[8px] md:text-xs"></i>';
                            html += `<div class="bg-slate-50/50 p-4 md:p-5 rounded-xl md:rounded-2xl border border-slate-100 hover:border-[#00b4d8]/20 transition-colors"><div class="flex items-center justify-between mb-2 md:mb-3"><div class="flex items-center gap-2 md:gap-3"><div class="w-6 h-6 md:w-8 md:h-8 rounded-full bg-[#1f3a40] text-white flex items-center justify-center font-bold text-[10px] md:text-xs">${rev.customerName.charAt(0)}</div><strong class="text-xs md:text-sm text-[#1f3a40] truncate max-w-[120px]">${rev.customerName}</strong></div><div class="flex gap-0.5">${stars}</div></div><p class="text-slate-600 font-semibold text-[11px] md:text-sm leading-relaxed">"${rev.comment}"</p></div>`;
                        });
                        html += `</div>`;
                    }
                    container.innerHTML = html;
                } else { container.innerHTML = '<p class="text-center text-[10px] md:text-sm font-bold text-slate-400 py-4 md:py-6">تعذر تحميل التقييمات حالياً.</p>'; }
            } catch (e) { container.innerHTML = '<p class="text-center text-[10px] md:text-sm font-bold text-red-400 py-4 md:py-6">خطأ في الاتصال بسيرفر التقييمات.</p>'; }
        }

        async function submitHotelReview(e) {
            e.preventDefault();
            const email = document.getElementById('reviewEmail').value.trim();
            const customerName = document.getElementById('reviewName').value.trim();
            const hotelName = document.getElementById('detailsHotelName').innerText;
            const rating = document.getElementById('reviewRating').value;
            const comment = document.getElementById('reviewComment').value.trim();
            try {
                const res = await fetch(`${API_URL}/api/v1/reviews/create`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, customerName, hotelName, rating, comment }) });
                const data = await res.json();
                if (data.success) { showToast('success', 'تم الإرسال', data.message); closeReviewModal(); fetchAndDisplayHotelReviews(hotelName); } else { showToast('error', 'فشل الإرسال', data.error); }
            } catch (err) { showToast('error', 'خطأ اتصال', 'تعذر الاتصال بالخادم.'); }
        }

        function goToBooking(hotelName, price, roomName, boardType, policyText, rateKey, paymentType, refundType) {
            if (!currentUser) { showToast('info', 'تنبيه', 'الرجاء تسجيل الدخول أولاً قبل الانتقال للحجز والاستفادة من خصم النقاط!'); openAuthModal(); return; }
            selectedHotel = `${hotelName} - ${roomName} (${boardType})`; currentBasePrice = price; currentPolicyText = policyText; currentRateKey = rateKey; currentPaymentType = paymentType || 'AT'; currentRefundType = refundType || 'full_100';
            
            document.getElementById('hotelNameTitle').innerHTML = `تأكيد حجز: <i class="fa-solid fa-hotel text-slate-400 mx-1 text-sm md:text-lg"></i> <br class="md:hidden" /><bdi dir="auto" class="text-[#1f3a40] text-base md:text-2xl mt-1 md:mt-0 inline-block"><span style="unicode-bidi: plaintext;">${hotelName}</span></bdi>`;
            document.getElementById('selectedRoomDetails').innerHTML = `
                <div class="absolute -left-2 md:-left-3 top-1/2 -translate-y-1/2 w-4 h-4 md:w-6 md:h-6 bg-white rounded-full border-r border-[#00b4d8]/30"></div>
                <div class="absolute -right-2 md:-right-3 top-1/2 -translate-y-1/2 w-4 h-4 md:w-6 md:h-6 bg-white rounded-full border-l border-[#00b4d8]/30"></div>
                <ul class="space-y-2.5 md:space-y-3.5 text-xs md:text-base font-bold text-slate-700">
                    <li class="flex items-start gap-2 md:gap-3"><i class="fa-solid fa-bed text-teal-600 mt-1 pl-0.5 shrink-0"></i><span>اختيارك: <bdi dir="auto" class="text-teal-800"><span style="unicode-bidi: plaintext;">${roomName}</span></bdi></span></li>
                    <li class="flex items-start gap-2 md:gap-3"><i class="fa-solid fa-utensils text-yellow-600 mt-1 pl-1 shrink-0"></i><span>الوجبات: <span class="text-yellow-800">${boardType}</span></span></li>
                    <li class="flex items-start gap-2 md:gap-3"><i class="fa-solid fa-shield-halved text-green-600 mt-1 pl-1 shrink-0"></i><span>سياسة الإلغاء: <span class="text-green-800 whitespace-pre-line block mt-0.5 md:mt-1 text-[10px] md:text-sm"><bdi dir="auto"><span style="unicode-bidi: plaintext;">${policyText}</span></bdi></span></span></li>
                </ul>`;

            const payMethodsContainer = document.getElementById('paymentMethodsContainer');
            const electronicPaymentHTML = `
                <label class="bg-white border-2 border-[#00b4d8] rounded-xl p-3 md:p-4 flex flex-col sm:flex-row items-center justify-between gap-3 md:gap-4 relative cursor-pointer selected-pay-option" onclick="selectPayment('visa', this)">
                    <input type="radio" name="payMethod" value="visa" checked class="hidden">
                    <div class="absolute -top-2 -right-2 md:-top-2.5 md:-right-2.5 w-5 h-5 md:w-6 md:h-6 bg-[#00b4d8] rounded-full text-white flex items-center justify-center shadow-md check-icon"><i class="fa-solid fa-check text-[8px] md:text-xs"></i></div>
                    <div class="flex items-center gap-2 md:gap-3"><i class="fa-regular fa-credit-card text-[#00b4d8] text-lg md:text-xl"></i><div><span class="block font-black text-slate-800 text-xs md:text-sm">دفع إلكتروني آمن</span><span class="block text-[10px] md:text-xs font-bold text-slate-400 mt-0.5">مطلوب مسبقاً لتأكيد الحجز</span></div></div>
                    <div class="flex items-center gap-2 md:gap-2.5 text-xl md:text-2xl text-slate-300 mt-2 sm:mt-0"><i class="fa-brands fa-cc-visa"></i><i class="fa-brands fa-cc-mastercard"></i><i class="fa-brands fa-cc-apple-pay"></i></div>
                </label>`;
            
            const hotelPaymentHTML = `
                <label class="bg-white border-2 border-slate-200 rounded-xl p-3 md:p-4 flex flex-col sm:flex-row items-center justify-between gap-3 md:gap-4 relative cursor-pointer selected-pay-option" onclick="selectPayment('hotel', this)">
                    <input type="radio" name="payMethod" value="hotel" class="hidden">
                    <div class="absolute -top-2 -right-2 md:-top-2.5 md:-right-2.5 w-5 h-5 md:w-6 md:h-6 bg-[#00b4d8] rounded-full text-white items-center justify-center shadow-md check-icon hidden"><i class="fa-solid fa-check text-[8px] md:text-xs"></i></div>
                    <div class="flex items-center gap-2 md:gap-3"><i class="fa-solid fa-bell-concierge text-slate-400 text-lg md:text-xl"></i><div><span class="block font-black text-slate-800 text-xs md:text-sm">الدفع في الفندق</span><span class="block text-[10px] md:text-xs font-bold text-slate-400 mt-0.5">يتم الدفع عند الاستقبال</span></div></div>
                </label>`;

            if (currentPaymentType === 'HOTEL') { payMethodsContainer.innerHTML = electronicPaymentHTML + hotelPaymentHTML; } 
            else { payMethodsContainer.innerHTML = electronicPaymentHTML; }
            
            document.getElementById('custName').value = currentUser.name; document.getElementById('custEmail').value = currentUser.email; document.getElementById('custPhone').value = currentUser.phone || '';
            
            document.getElementById('summaryBasePrice').innerText = currentBasePrice;
            document.getElementById('checkoutAvailablePoints').innerText = currentUser.points || 0;
            
            setupPointsDropdown(); switchView('bookingView');
        }

        function setupPointsDropdown() {
            const select = document.getElementById('pointsDiscountSelect');
            if (!select) return; select.innerHTML = '<option value="0">بدون استخدام نقاط</option>';
            if(currentUser && currentUser.points >= 50) {
                let maxPointsToUse = Math.min(currentUser.points, currentBasePrice * 10);
                for(let p = 50; p <= maxPointsToUse; p += 50) { select.innerHTML += `<option value="${p}">${p} نقطة (خصم ${p/10} AED)</option>`; }
            }
            updateFinalPriceCalculation();
        }

        function updateFinalPriceCalculation() {
            const usedPts = parseInt(document.getElementById('pointsDiscountSelect').value) || 0;
            const discountAED = usedPts / 10;
            let finalAED = Math.max(0, currentBasePrice - discountAED);
            
            const discountRow = document.getElementById('discountRow');
            if(discountAED > 0) {
                discountRow.classList.remove('hidden');
                document.getElementById('summaryDiscountAmount').innerText = discountAED;
            } else {
                discountRow.classList.add('hidden');
            }

            const selectedCurrency = document.getElementById('currencySelector').value;
            const currencyLabel = document.getElementById('finalPriceCurrencyLabel');
            const rates = { 'USD': 0.27, 'EUR': 0.25, 'SAR': 1.02, 'AED': 1 };
            
            let converted = (finalAED * rates[selectedCurrency]).toFixed(2);
            document.getElementById('finalPriceDisplay').innerText = converted;
            if (currencyLabel) currencyLabel.innerText = selectedCurrency;
        }

        function selectPayment(method, element) {
            document.querySelectorAll('.selected-pay-option').forEach(el => {
                el.classList.remove('border-[#00b4d8]'); el.classList.add('border-slate-200');
                const checkIcon = el.querySelector('.check-icon'); if(checkIcon) { checkIcon.classList.remove('flex'); checkIcon.classList.add('hidden'); }
                const mainIcon = el.querySelector('.fa-solid, .fa-regular'); if(mainIcon) { mainIcon.classList.remove('text-[#00b4d8]'); mainIcon.classList.add('text-slate-400'); }
            });
            element.classList.remove('border-slate-200'); element.classList.add('border-[#00b4d8]');
            const activeCheck = element.querySelector('.check-icon'); if(activeCheck) { activeCheck.classList.remove('hidden'); activeCheck.classList.add('flex'); }
            const activeMain = element.querySelector('.fa-solid, .fa-regular'); if(activeMain) { activeMain.classList.remove('text-slate-400'); activeMain.classList.add('text-[#00b4d8]'); }
            element.querySelector('input').checked = true;
        }

        async function confirmReservation(e) {
            e.preventDefault();
            const customerName = document.getElementById('custName').value; 
            const email = document.getElementById('custEmail').value; 
            const phone = document.getElementById('custPhone').value;
            const companions = document.getElementById('custCompanions').value; 
            const paymentMethod = document.querySelector('input[name="payMethod"]:checked').value; 
            const pointsUsed = parseInt(document.getElementById('pointsDiscountSelect').value) || 0;
            
            const btn = e.target.querySelector('button[type="submit"]'); 
            const origText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-sm md:text-lg"></i> <span class="text-xs md:text-sm">جاري التجهيز (Ziina)...</span>'; 
            btn.disabled = true;

            try {
                const bookingReference = 'RIMAL-' + Math.floor(100000 + Math.random() * 900000);
                let finalPrice = Math.max(0, currentBasePrice - (pointsUsed / 10));

                const ziinaRes = await fetch(`${API_URL}/api/v1/payments/ziina-intent`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ amountAED: finalPrice, bookingReference: bookingReference }) 
                });
                const ziinaData = await ziinaRes.json();

                if (ziinaData.success && (ziinaData.redirect_url || ziinaData.embedded_url)) {
                    const pendingData = { 
                        bookingReference, 
                        ziinaPaymentId: ziinaData.ziinaPaymentId || '', 
                        hotelName: selectedHotel, 
                        customerName, 
                        email, 
                        phone, 
                        companions, 
                        paymentMethod, 
                        price: finalPrice, 
                        pointsUsed, 
                        cancellationPolicy: currentPolicyText, 
                        rateKey: currentRateKey, 
                        refundType: currentRefundType 
                    };
                    localStorage.setItem('pending_reservation', JSON.stringify(pendingData)); 

                    btn.innerHTML = '<i class="fa-solid fa-lock text-sm md:text-lg"></i> <span class="text-xs md:text-sm">جاري تحويلك لصفحة الدفع...</span>';
                    
                    const paymentUrl = ziinaData.redirect_url || ziinaData.embedded_url;
                    window.location.href = paymentUrl;

                } else { 
                    showToast('error', 'خطأ في الدفع', ziinaData.error || 'تعذر إنشاء رابط الدفع'); 
                    btn.innerHTML = origText; 
                    btn.disabled = false; 
                }
            } catch(err) { 
                console.error(err); 
                showToast('error', 'خطأ اتصال', 'تعذر الاتصال بالخادم أثناء تجهيز الدفع.'); 
                btn.innerHTML = origText; 
                btn.disabled = false; 
            }
        }
    </script>
</body>
</html>
