<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الرمال الدولية - حجز الفنادق</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        header { background: #1b263b; color: white; padding: 20px; text-align: center; border-radius: 10px; }
        .search-box { background: white; padding: 20px; margin-top: 20px; border-radius: 10px; display: flex; gap: 15px; flex-wrap: wrap; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .search-group { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
        .search-group label { font-weight: bold; margin-bottom: 5px; color: #333; }
        .search-group input, .search-group select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-search { background: #d90429; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; align-self: flex-end; }
        .hotels-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .hotel-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hotel-card img { width: 100%; height: 180px; object-fit: cover; }
        .hotel-info { padding: 15px; }
        .price { color: #d90429; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>شركة الرمال الدولية للسياحة والشحن</h1>
        <p>احجز أفضل الفنادق حول العالم بضغطة زر واحدة</p>
    </header>

    <!-- محرك البحث المتقدم -->
    <div class="search-box">
        <div class="search-group">
            <label><i class="fa-solid fa-location-dot"></i> الوجهة أو الفندق</label>
            <input type="text" id="searchInput" placeholder="دبي، فندق...">
        </div>
        <div class="search-group">
            <label><i class="fa-solid fa-coins"></i> السعر الأقصى (AED)</label>
            <input type="number" id="maxPriceInput" placeholder="مثال: 1000">
        </div>
        <button class="btn-search" onclick="searchHotels()">بحث ذكي 🚀</button>
    </div>

    <!-- نتائج البحث -->
    <div id="hotelsContainer" class="hotels-grid">
        <!-- ستظهر الفنادق هنا تلقائياً -->
    </div>

    <script>
        async function searchHotels() {
            const destination = document.getElementById('searchInput').value;
            const maxPrice = document.getElementById('maxPriceInput').value;

            let url = `/api/hotels/advanced-search?destination=${encodeURIComponent(destination)}`;
            if(maxPrice) url += `&maxPrice=${maxPrice}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                const container = document.getElementById('hotelsContainer');
                container.innerHTML = '';

                if(data.success && data.hotels.length > 0) {
                    data.hotels.forEach(hotel => {
                        container.innerHTML += `
                            <div class="hotel-card">
                                <img src="${hotel.img || 'https://images.unsplash.com/photo-1566073771259-6a8506099945'}" alt="hotel">
                                <div class="hotel-info">
                                    <h3>${hotel.name}</h3>
                                    <p><i class="fa-solid fa-map-pin"></i> ${hotel.city} - ${hotel.address}</p>
                                    <div class="price">${hotel.priceAED} AED / ليلة</div>
                                    <p style="color:green; font-size:12px;">${hotel.policyText || ''}</p>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p style="text-align:center; width:100%;">عذراً، لم نجد نتائج مطابقة لبحثك.</p>';
                }
            } catch (e) {
                console.error(e);
            }
        }

        searchHotels();
    </script>
</body>
</html>
