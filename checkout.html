<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الحجز والدفع - شركة الرمال الدولية</title>
    <!-- استخدام Tailwind CSS لتصميم عصري وسريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f9fafb; }
        /* أنيميشن التحميل */
        .loader {
            border-top-color: #3498db;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- بطاقة الدفع -->
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden border border-gray-100">
        <!-- الترويسة -->
        <div class="bg-slate-800 p-6 text-center">
            <h2 class="text-2xl font-bold text-white">شركة الرمال الدولية ✈️</h2>
            <p class="text-slate-300 text-sm mt-1">بوابة الدفع الآمنة عبر Ziina</p>
        </div>

        <!-- تفاصيل الحجز (بيانات تجريبية) -->
        <div class="p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4 border-b pb-2">ملخص الحجز</h3>
            
            <div class="flex justify-between mb-3 text-sm">
                <span class="text-gray-500">رقم المرجع:</span>
                <span class="font-semibold text-gray-800" id="displayRef">RIMAL-847201</span>
            </div>
            
            <div class="flex justify-between mb-3 text-sm">
                <span class="text-gray-500">الفندق:</span>
                <span class="font-semibold text-gray-800">DoubleTree by Hilton</span>
            </div>

            <div class="flex justify-between mb-6 text-lg border-t pt-4">
                <span class="font-bold text-gray-800">الإجمالي للدفع:</span>
                <span class="font-bold text-rose-600" id="displayAmount">250 AED</span>
            </div>

            <!-- زر الدفع -->
            <button id="payButton" onclick="initiatePayment()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-300 flex justify-center items-center">
                <span id="buttonText">تأكيد الحجز والدفع الآن</span>
                <div id="loadingSpinner" class="loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-5 w-5 mr-3 hidden"></div>
            </button>
            
            <p id="errorMessage" class="text-red-500 text-sm text-center mt-3 hidden"></p>
        </div>
    </div>

    <script>
        // دالة الدفع التي تتصل بالسيرفر الخاص بك
        async function initiatePayment() {
            const payButton = document.getElementById('payButton');
            const buttonText = document.getElementById('buttonText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const errorMessage = document.getElementById('errorMessage');

            // بيانات الحجز (يجب أن تأتي من سلة مشتريات العميل لاحقاً)
            const bookingData = {
                amountAED: 250, // المبلغ بالدرهم
                bookingReference: "RIMAL-847201" // رقم المرجع
            };

            // تغيير شكل الزر ليظهر أن العملية جارية
            payButton.disabled = true;
            payButton.classList.add('opacity-75', 'cursor-not-allowed');
            buttonText.innerText = "جاري تحويلك للدفع...";
            loadingSpinner.classList.remove('hidden');
            errorMessage.classList.add('hidden');

            try {
                // الاتصال بسيرفر Render الخاص بك
                const response = await fetch('https://rimal-api.onrender.com/api/v1/payments/ziina-intent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bookingData)
                });

                const data = await response.json();

                if (data.success && data.redirect_url) {
                    // توجيه العميل فوراً إلى صفحة الدفع الآمنة الخاصة بـ Ziina
                    window.location.href = data.redirect_url;
                } else {
                    throw new Error(data.error || 'حدث خطأ مجهول في بوابة الدفع');
                }

            } catch (error) {
                console.error('Payment Error:', error);
                
                // إظهار رسالة الخطأ للعميل وإعادة الزر لحالته الطبيعية
                errorMessage.innerText = "عذراً، فشل الاتصال ببوابة الدفع. تأكد من اتصال السيرفر بالإنترنت.";
                errorMessage.classList.remove('hidden');
                
                payButton.disabled = false;
                payButton.classList.remove('opacity-75', 'cursor-not-allowed');
                buttonText.innerText = "تأكيد الحجز والدفع الآن";
                loadingSpinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
