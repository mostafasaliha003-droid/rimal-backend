<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة | شركة الرمال الدولية ✈️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1f3a40;
            --accent-cyan: #00b4d8;
            --accent-coral: #ff595e;
            --accent-yellow: #ffca3a;
            --bg-light: #f7fff7;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(31, 58, 64, 0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); color: var(--primary); }

        header {
            background-color: var(--white); padding: 15px 5%; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-bottom: 4px dashed var(--accent-cyan);
        }
        .brand { font-size: 20px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        /* نموذج تسجيل دخول الأدمن */
        #adminLoginBox {
            max-width: 450px; background: white; padding: 35px; border-radius: 24px;
            box-shadow: var(--shadow); border: 4px solid var(--accent-yellow); margin: 60px auto; text-align: center;
        }
        .form-group { margin-bottom: 18px; text-align: right; }
        .form-group label { display: block; font-weight: 900; margin-bottom: 6px; color: var(--primary); }
        .form-group input { width: 100%; padding: 14px; border-radius: 14px; border: 2px solid #cbd5e1; outline: none; font-size: 14px; font-weight: 700; }
        .btn-admin { background: linear-gradient(135deg, var(--accent-coral), #d90429); color: white; border: none; padding: 14px; width: 100%; font-weight: 900; border-radius: 14px; cursor: pointer; font-size: 16px; }

        /* لوحة التحكم الرئيسية */
        #adminDashboard { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 22px; border-radius: 20px; box-shadow: var(--shadow); border: 3px solid var(--accent-cyan); text-align: center; }
        .stat-card h4 { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; font-weight: 800; }
        .stat-card span { font-size: 26px; font-weight: 900; color: var(--accent-coral); }

        .table-card { background: white; padding: 25px; border-radius: 24px; box-shadow: var(--shadow); border: 3px solid var(--accent-yellow); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: right; }
        th, td { padding: 14px; border-bottom: 2px solid #e9ecef; font-size: 14px; }
        th { background: #f8f9fa; font-weight: 900; color: var(--primary); }
        .badge { padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 12px; display: inline-block; }
        .badge-active { background: rgba(0, 180, 216, 0.15); color: var(--accent-cyan); }
        .badge-cancelled { background: rgba(255, 89, 94, 0.15); color: var(--accent-coral); }
        
        .action-btn { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; margin-left: 5px; }
        .action-btn.danger { background: var(--accent-coral); }
    </style>
</head>
<body>

    <header>
        <div class="brand"><i class="fa-solid fa-shield-halved" style="color: var(--accent-coral);"></i> لوحة تحكم الإدارة - شركة الرمال الدولية ✈️</div>
        <button id="logoutBtn" onclick="adminLogout()" style="display:none; background:var(--accent-coral); color:white; border:none; padding:8px 16px; border-radius:10px; font-weight:bold; cursor:pointer;">تسجيل خروج</button>
    </header>

    <div class="container">
        <!-- نموذج تسجيل دخول المدير -->
        <div id="adminLoginBox">
            <h2 style="color: var(--primary); margin-bottom: 20px;">تسجيل دخول الإدارة 🔐</h2>
            <form onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label>البريد الإداري:</label>
                    <input type="email" id="adminEmail" required placeholder="management@remaltourismllc.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="adminPassword" required placeholder="********">
                </div>
                <button type="submit" class="btn-admin">دخول لوحة التحكم 🚀</button>
            </form>
        </div>

        <!-- لوحة التحكم الرئيسية للأدمن -->
        <div id="adminDashboard">
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>إجمالي أرباح الشركة (نشط) 💰</h4>
                    <span id="totalRevenue">0</span> <small style="font-weight:bold;">AED</small>
                </div>
                <div class="stat-card">
                    <h4>إجمالي عدد الحجوزات 📊</h4>
                    <span id="totalBookingsCount">0</span>
                </div>
                <div class="stat-card">
                    <h4>الحجوزات النشطة ✅</h4>
                    <span id="activeBookingsCount" style="color: var(--accent-cyan);">0</span>
                </div>
                <div class="stat-card">
                    <h4>الحجوزات الملغية ❌</h4>
                    <span id="cancelledBookingsCount" style="color: var(--accent-coral);">0</span>
                </div>
            </div>

            <div class="table-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="color: var(--primary);"><i class="fa-solid fa-list-check"></i> سجل الحجوزات السحابية المباشر</h3>
                    <button onclick="loadAdminData()" style="background: var(--accent-cyan); color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer;"><i class="fa-solid fa-rotate"></i> تحديث السجلات</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>رقم المرجع</th>
                            <th>اسم العميل</th>
                            <th>الإيميل</th>
                            <th>الفندق</th>
                            <th>المبلغ (AED)</th>
                            <th>الحالة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="adminBookingsTable">
                        <!-- سيتم تعبئتها برمجياً -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://rimal-api.onrender.com';
        let isAdminLoggedIn = localStorage.getItem('rimal_admin_auth') === 'true';

        window.onload = function() {
            if(isAdminLoggedIn) {
                document.getElementById('adminLoginBox').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'block';
                loadAdminData();
            }
        };

        async function handleAdminLogin(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value.trim();

            try {
                const res = await fetch(`${API_URL}/api/v1/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if(data.success) {
                    localStorage.setItem('rimal_admin_auth', 'true');
                    document.getElementById('adminLoginBox').style.display = 'none';
                    document.getElementById('adminDashboard').style.display = 'block';
                    document.getElementById('logoutBtn').style.display = 'block';
                    loadAdminData();
                    alert('✅ تم تسجيل دخول الإدارة بنجاح!');
                } else {
                    alert('❌ خطأ: ' + data.error);
                }
            } catch(err) {
                alert('❌ خطأ في الاتصال بالخادم.');
            }
        }

        async function loadAdminData() {
            try {
                const res = await fetch(`${API_URL}/api/v1/admin/stats`);
                const data = await res.json();
                if(data.success) {
                    document.getElementById('totalRevenue').innerText = data.stats.totalRevenueAED.toLocaleString();
                    document.getElementById('totalBookingsCount').innerText = data.stats.totalBookings;
                    document.getElementById('activeBookingsCount').innerText = data.stats.activeBookings;
                    document.getElementById('cancelledBookingsCount').innerText = data.stats.cancelledBookings;

                    const tbody = document.getElementById('adminBookingsTable');
                    tbody.innerHTML = '';
                    
                    if(data.bookings.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">لا توجد حجوزات مسجلة في السحابة حالياً.</td></tr>`;
                    } else {
                        data.bookings.forEach(b => {
                            let isCancelled = b.status === 'cancelled';
                            tbody.innerHTML += `
                                <tr>
                                    <td><b style="color:var(--accent-coral);">${b.bookingReference}</b></td>
                                    <td>${b.customerName}</td>
                                    <td>${b.email}</td>
                                    <td>${b.hotelName}</td>
                                    <td><b>${b.price}</b> AED</td>
                                    <td><span class="badge ${isCancelled ? 'badge-cancelled' : 'badge-active'}">${isCancelled ? 'ملغي ❌' : 'نشط ✅'}</span></td>
                                    <td>
                                        <a href="${API_URL}/api/bookings/pdf/${b.bookingReference}" target="_blank" class="action-btn" style="text-decoration:none;">📄 PDF</a>
                                        ${!isCancelled ? `<button onclick="updateBookingStatus('${b.bookingReference}', 'cancelled')" class="action-btn danger">إلغاء ❌</button>` : `<button onclick="updateBookingStatus('${b.bookingReference}', 'active')" class="action-btn">تفعيل ✅</button>`}
                                    </td>
                                </tr>
                            `;
                        });
                    }
                }
            } catch(err) {
                console.error('خطأ في جلب إحصائيات الإدارة');
            }
        }

        async function updateBookingStatus(bookingReference, status) {
            if(!confirm(`هل أنت متأكد من تغيير حالة الحجز ${bookingReference} إلى (${status})؟`)) return;
            try {
                const res = await fetch(`${API_URL}/api/v1/admin/update-booking-status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bookingReference, status })
                });
                const data = await res.json();
                if(data.success) {
                    alert('✅ ' + data.message);
                    loadAdminData();
                } else {
                    alert('❌ ' + data.error);
                }
            } catch(e) {
                alert('❌ خطأ في الاتصال بالخادم.');
            }
        }

        function adminLogout() {
            localStorage.removeItem('rimal_admin_auth');
            location.reload();
        }
    </script>
</body>
</html>
